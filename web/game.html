<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Metro Tunnel Game</title>
<style>
  body { margin: 0; overflow: hidden; background: black; }
  canvas { display: block; background: #111; }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

canvas.width = 800;
canvas.height = 400;

const player = {
  x: 380,
  y: 340,
  w: 40,
  h: 40,
  speed: 300
};

let bullets = [];
let enemies = [];
let keys = {};
let lastShot = 0;
let lastSpawn = 0;
let gameOver = false;

// ✅ USE e.code (THIS IS THE REAL FIX)
document.addEventListener('keydown', e => keys[e.code] = true);
document.addEventListener('keyup', e => keys[e.code] = false);

function spawnEnemy() {
  enemies.push({
    x: Math.random() * (canvas.width - 40),
    y: -40,
    w: 40,
    h: 40,
    speed: 120
  });
}

function hit(a, b) {
  return (
    a.x < b.x + b.w &&
    a.x + a.w > b.x &&
    a.y < b.y + b.h &&
    a.y + a.h > b.y
  );
}

let lastTime = 0;
function gameLoop(time) {
  if (gameOver) return;

  const dt = (time - lastTime) / 1000;
  lastTime = time;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#222';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // ✅ LEFT AND RIGHT — GUARANTEED
  if ((keys.KeyA || keys.ArrowLeft) && player.x > 0) {
    player.x -= player.speed * dt;
  }
  if ((keys.KeyD || keys.ArrowRight) && player.x + player.w < canvas.width) {
    player.x += player.speed * dt;
  }

  // shooting
  if (keys.KeyW && time - lastShot > 300) {
    bullets.push({
      x: player.x + player.w / 2 - 5,
      y: player.y,
      w: 10,
      h: 20,
      speed: 500
    });
    lastShot = time;
  }

  // player
  ctx.fillStyle = 'blue';
  ctx.fillRect(player.x, player.y, player.w, player.h);

  // bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.y -= b.speed * dt;
    if (b.y + b.h < 0) bullets.splice(i, 1);
    else {
      ctx.fillStyle = 'yellow';
      ctx.fillRect(b.x, b.y, b.w, b.h);
    }
  }

  // spawn enemies
  if (time - lastSpawn > 800) {
    spawnEnemy();
    lastSpawn = time;
  }

  // enemies
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.y += e.speed * dt;

    ctx.fillStyle = 'brown';
    ctx.fillRect(e.x, e.y, e.w, e.h);

    for (let j = bullets.length - 1; j >= 0; j--) {
      if (hit(bullets[j], e)) {
        bullets.splice(j, 1);
        enemies.splice(i, 1);
        break;
      }
    }

    if (hit(player, e)) {
      gameOver = true;
      alert('Game Over');
      location.reload();
      return;
    }

    if (e.y > canvas.height) enemies.splice(i, 1);
  }

  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
