<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Metro Tunnel Game</title>
<style>
    body {
        margin: 0;
        overflow: hidden;
        background: black;
    }
    canvas {
        display: block;
        background: #111;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
    }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<script>



// ------------------------------------------------------
// CANVAS SETUP
// ------------------------------------------------------
const canvas = document.getElementById("gameCanvas");
if (!canvas) throw new Error("Canvas not found!");

const ctx = canvas.getContext("2d");
if (!ctx) throw new Error("2D context not supported!");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// ------------------------------------------------------
// LOAD IMAGES
// ------------------------------------------------------
const bg = new Image();
bg.src = "https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fthumbs.dreamstime.com%2Fb%2Festaci%25C3%25B3n-de-metro-p%25C3%25ADxeles-arte-ocupada-con-personajes-abordando-trenes-graffiti-decora-las-paredes-luces-brillantes-resaltan-la-346222671.jpg&f=1&nofb=1&ipt=cb4dcfb1872848f1faef6208b2ef5fd82d442d0179219a4bbcbc6fa9fbc2553b";
const playerSprite = new Image();
playerSprite.src = "https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Forig00.deviantart.net%2Ff95a%2Ff%2F2017%2F180%2Fa%2F2%2Fpixel_art_gif___soldier_shooting_by_blurredmirror-dbegn0d.png&f=1&nofb=1&ipt=35f01f717fca19442f11a9721021c90a0fccde5fa3fad4d6a3393d33d29926b2";
const enemySprite = new Image();
enemySprite.src = "https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fimages-wixmp-ed30a86b8c4ca887773594c2.wixmp.com%2Ff%2F1f7933b1-db88-4417-b2af-72b709a3fa0b%2Fdg3d8k9-9dd8aaa3-87b2-4d3b-bdb1-0f826e26c7bb.png%2Fv1%2Ffill%2Fw_200%2Ch_200%2Fhomeless_man_pixel_art_by_briendead_dg3d8k9-fullview.png%3Ftoken%3DeyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ1cm46YXBwOjdlMGQxODg5ODIyNjQzNzNhNWYwZDQxNWVhMGQyNmUwIiwiaXNzIjoidXJuOmFwcDo3ZTBkMTg4OTgyMjY0MzczYTVmMGQ0MTVlYTBkMjZlMCIsIm9iaiI6W1t7ImhlaWdodCI6Ijw9MjAwIiwicGF0aCI6IlwvZlwvMWY3OTMzYjEtZGI4OC00NDE3LWIyYWYtNzJiNzA5YTNmYTBiXC9kZzNkOGs5LTlkZDhhYWEzLTg3YjItNGQzYi1iZGIxLTBmODI2ZTI2YzdiYi5wbmciLCJ3aWR0aCI6Ijw9MjAwIn1dXSwiYXVkIjpbInVybjpzZXJ2aWNlOmltYWdlLm9wZXJhdGlvbnMiXX0.b5JabULAoHNu30L0z83aSKK8BET-ZlYpdntiTjHMqsE&f=1&nofb=1&ipt=87bbd82bff544abe8b85d76bc2b90d15564e6687ed3d8956964b1792e7aa34f0";

// ------------------------------------------------------
// PLAYER
// ------------------------------------------------------
const player = {
    x: canvas.width * 0.1,      // 10% from left
    y: canvas.height * 0.5,     // 80% down
    width: canvas.width * 0.16,
    height: canvas.height * 0.30,
    speed: 8
};

// ------------------------------------------------------
// BULLETS
// ------------------------------------------------------
let bullets = [];

// ------------------------------------------------------
// ENEMIES
// ------------------------------------------------------
let enemies = [];
let totalEnemies = 25;
let enemiesSpawned = 0;

function spawnEnemy() {
    if (enemiesSpawned >= totalEnemies) return;
    enemies.push({
        x: canvas.width + 50,
        y: canvas.height * 0.55,
        width: canvas.width * 0.12,
        height: canvas.height * 0.24,
        speed: 2,
        hp: 2
    });
    enemiesSpawned++;
}

// ------------------------------------------------------
// RESIZE HANDLER
// ------------------------------------------------------
window.addEventListener("resize", () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // keep player near bottom
    player.y = canvas.height * 0.8;
    player.width = canvas.width * 0.08;
    player.height = canvas.height * 0.15;

    // reposition enemies near bottom
    enemies.forEach(e => {
        e.y = canvas.height * 0.75;
        e.width = canvas.width * 0.06;
        e.height = canvas.height * 0.12;
    });
});

// ------------------------------------------------------
// CONTROLS
// ------------------------------------------------------
const keys = {};
document.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
document.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

// ------------------------------------------------------
// GAME LOOP
// ------------------------------------------------------
function gameLoop() {
    // BACKGROUND DRAWING
if (bg.complete) {
    ctx.drawImage(bg, 0, 0, canvas.width, canvas.height);
} else {
    // fallback color if image not loaded yet
    ctx.fillStyle = "#222";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
}
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // BACKGROUND
    ctx.drawImage(bg, 0, 0, canvas.width, canvas.height);

    // COUNTER
    let enemiesLeft = totalEnemies - enemiesSpawned + enemies.length;
    ctx.fillStyle = "white";
    ctx.font = "20px Arial";
    ctx.fillText("Enemies left: " + enemiesLeft, 20, 30);

    // WIN CONDITION
    if (enemiesLeft <= 0) {
        ctx.fillStyle = "lime";
        ctx.font = "40px Arial";
        ctx.fillText("YOU WIN!", canvas.width / 2 - 100, canvas.height / 2);
        return;
    }

    // PLAYER MOVEMENT
    if (keys["a"] && player.x > 0) {
        player.x -= player.speed;
    }
    if (keys["d"] && player.x + player.width < canvas.width) {
        player.x += player.speed;
    }

    // SHOOT
    if (keys["w"]) {
        if (bullets.length === 0 || Date.now() - bullets[bullets.length - 1].time > 300) {
            bullets.push({
                x: player.x + player.width - 10,
                y: player.y + player.height / 2 - 5,
                width: 16,
                height: 8,
                speed: 7,
                time: Date.now()
            });
        }
    }

    // DRAW PLAYER
    ctx.drawImage(playerSprite, player.x, player.y, player.width, player.height);

    // UPDATE BULLETS
    bullets.forEach((b, i) => {
        b.x += b.speed;
        ctx.fillStyle = "yellow";
        ctx.fillRect(b.x, b.y, b.width, b.height);
        if (b.x > canvas.width) bullets.splice(i, 1);
    });

    // SPAWN ENEMIES
    if (Math.random() < 0.02) spawnEnemy();

    // UPDATE ENEMIES
    enemies.forEach((e, i) => {
        e.x -= e.speed;
        ctx.drawImage(enemySprite, e.x, e.y, e.width, e.height);

        // bullet collision
        bullets.forEach((b, j) => {
            if (b.x < e.x + e.width &&
                b.x + b.width > e.x &&
                b.y < e.y + e.height &&
                b.y + b.height > e.y) {
                bullets.splice(j, 1);
                e.hp--;
                if (e.hp <= 0) enemies.splice(i, 1);
            }
        });

        // player collision
        if (player.x < e.x + e.width &&
            player.x + player.width > e.x &&
            player.y < e.y + e.height &&
            player.y + player.height > e.y) {
            alert("YOU LOSE!");
            window.location.reload();
        }

        // enemy leaves screen
        if (e.x + e.width < 0) enemies.splice(i, 1);
    });

    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
