<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Tanuló Adatok</title>
</head>
<body>
    <h1>Tanuló Adatok</h1>
    
    <form onsubmit="sendData(event)">
        <label>ID:</label>
        <input type="number" id="id" required>
        <br><br>
        
        <label>Név:</label>
        <input type="text" id="nev" required>
        <br><br>
        
        <label>Kor:</label>
        <input type="number" id="kor" required>
        <br><br>
        
        <button type="submit">Küldés</button>
    </form>

    <div id="message"></div>

    <script>
        async function sendData(event) {
            event.preventDefault();
            
            const data = {
                id: document.getElementById('id').value,
                nev: document.getElementById('nev').value,
                kor: document.getElementById('kor').value
            };
            
            try {
                const response = await fetch('https://retoolapi.dev/tasQR2/tanulo', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                
            } catch (error) {
                document.getElementById('message').textContent = 'Hiba: ' + error.message;
            }
        }
    </script>
</body>
</html>
