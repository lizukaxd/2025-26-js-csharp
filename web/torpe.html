<!DOCTYPE html>
<html>
<body>

<h2>JavaScript HTML DOM</h2>

<table id="torpekTabla"></table>

<script>
const sorok = [
	[-1, "Hófehérke"],
	[0, "Gonosz mostoha"],
	[1, "Tudor"],
	[2, "Vidor"],
	[3, "Szundi"],
	[4, "Hapci"],
	[5, "Morgó"],
	[6, "Szende"],
	[7, "Kuka"]
];

let tabla = document.getElementById("torpekTabla");
for (let i = 0; i < sorok.length; i++) {
	let tr = document.createElement("tr");
	let tdSorszam = document.createElement("td");
	let tdNev = document.createElement("td");
	tdSorszam.innerText = sorok[i][0];
	tdNev.innerText = sorok[i][1];
	tr.appendChild(tdSorszam);
	tr.appendChild(tdNev);
	tabla.appendChild(tr);
}
</script>

</body>
</html>
