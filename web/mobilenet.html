<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaja vagy nem?</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.11.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.0"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: white;
            color: black;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2em;
        }

        .upload-area {
            border: 2px solid black;
            padding: 40px;
            text-align: center;
            margin: 20px auto;
            max-width: 600px;
            cursor: pointer;
        }

        #fileInput {
            display: none;
        }

        button {
            background: black;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1em;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #333;
        }

        #status {
            text-align: center;
            padding: 10px;
            margin: 20px 0;
            display: none;
        }

        .results {
            max-width: 1200px;
            margin: 20px auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        th, td {
            border: 2px solid black;
            padding: 15px;
            text-align: left;
        }

        th {
            background: black;
            color: white;
            font-weight: bold;
        }

        td img {
            max-width: 150px;
            max-height: 150px;
            display: block;
        }

        .verdict {
            font-size: 1.5em;
            font-weight: bold;
        }

        .verdict.yes {
            color: black;
        }

        .verdict.no {
            color: black;
        }
    </style>
</head>
<body>
    <h1>Kaja vagy nem?</h1>

    <div class="upload-area" id="uploadArea">
        <h3>Kattints ide vagy húzd be a képet</h3>
        <input type="file" id="fileInput" accept="image/*" multiple>
        <button onclick="document.getElementById('fileInput').click()">
            Kép kiválasztása
        </button>
    </div>

    <div id="status"></div>
    <div class="results" id="results"></div>

    <script>
        let model;

        // Étel kategóriák
        const foodKeywords = ['pizza', 'hamburger', 'hot dog', 'cheeseburger', 'french fries', 'burrito', 'taco', 
            'ice cream', 'chocolate', 'apple', 'banana', 'orange', 'strawberry', 'carrot', 'broccoli',
            'sandwich', 'bread', 'bagel', 'pretzel', 'spaghetti', 'ravioli', 'noodle', 'dumpling',
            'soup', 'stew', 'meat loaf', 'chicken', 'drumstick', 'fried chicken', 'grilled salmon',
            'steak', 'mashed potato', 'guacamole', 'plate', 'cup', 'bowl', 'espresso', 'coffee',
            'breakfast', 'dinner', 'meal', 'food', 'candy', 'lollipop', 'cookie', 'cake', 'pie',
            'dough', 'pretzel', 'mushroom', 'corn', 'bell pepper', 'cucumber', 'acorn squash',
            'butternut squash', 'spaghetti squash', 'zucchini', 'artichoke', 'head cabbage',
            'cauliflower', 'grocery store'];

        async function loadModel() {
            document.getElementById('status').textContent = 'Modell betöltése...';
            document.getElementById('status').style.display = 'block';
            
            try {
                model = await mobilenet.load();
                document.getElementById('status').textContent = 'Kész! Tölts fel egy képet.';
            } catch (error) {
                document.getElementById('status').textContent = 'Hiba: ' + error.message;
            }
        }

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');

        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        async function handleFiles(files) {
            if (!model) {
                alert('Várj, a modell még betöltődik...');
                return;
            }

            const resultsDiv = document.getElementById('results');
            
            // Ha még nincs táblázat, létrehozunk egyet
            if (!document.querySelector('table')) {
                resultsDiv.innerHTML = `
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Kép</th>
                                <th>Eredmény</th>
                                <th>AI Elemzés</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                        </tbody>
                    </table>
                `;
            }

            for (let file of files) {
                await processImage(file);
            }
        }

        async function processImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                
                reader.onload = async (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    
                    img.onload = async () => {
                        const predictions = await model.classify(img);
                        const isFood = checkIfFood(predictions);
                        displayResult(e.target.result, isFood, predictions);
                        resolve();
                    };
                };
                
                reader.readAsDataURL(file);
            });
        }

        function checkIfFood(predictions) {
            for (let pred of predictions) {
                const label = pred.className.toLowerCase();
                for (let keyword of foodKeywords) {
                    if (label.includes(keyword)) {
                        return true;
                    }
                }
            }
            return false;
        }

        function displayResult(imageSrc, isFood, predictions) {
            const tableBody = document.getElementById('tableBody');
            
            // Sorszám
            const rowNumber = tableBody.children.length + 1;
            
            const verdictText = isFood ? 'IGEN, ez kaja!' : 'NEM, ez nem kaja!';
            const verdictClass = isFood ? 'yes' : 'no';
            
            let predictionsText = predictions.slice(0, 3).map(p => 
                `${p.className}: ${(p.probability * 100).toFixed(1)}%`
            ).join('<br>');
            
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${rowNumber}</td>
                <td><img src="${imageSrc}" alt="Feltöltött kép"></td>
                <td><div class="verdict ${verdictClass}">${verdictText}</div></td>
                <td>${predictionsText}</td>
            `;
            
            tableBody.appendChild(row);
        }

        window.addEventListener('load', loadModel);
    </script>
</body>
</html>
